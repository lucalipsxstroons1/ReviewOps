name: ReviewOps

on:
  pull_request:
    types: [opened, synchronize, reopened]

# The token of this workflow may read the code and write reviews, nothing else.
permissions:
  contents: read
  pull-requests: write

# A newer push makes the review of the older one pointless.
concurrency:
  group: reviewops-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI review
    runs-on: ubuntu-latest
    # Up to four requests to the model run at once. One request can take
    # three attempts of 120 seconds, and a pull request of the default size
    # needs at most two rounds of them.
    timeout-minutes: 15
    steps:
      # Needed to load the action from this repository. Third-party actions
      # are pinned to a commit, because a tag can be moved to other code.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No github-token is passed: the action falls back to the token of this run.
      # fail-on stays at its default "none": no finding fails this workflow.
      - name: Review the pull request
        id: review
        uses: ./
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          openai-model: gpt-4.1

      # Shows that later steps can use the outputs. The values reach the shell
      # through the environment, never as an expression inside the command.
      - name: Show the result
        env:
          FINDINGS_COUNT: ${{ steps.review.outputs.findings-count }}
          CRITICAL_COUNT: ${{ steps.review.outputs.critical-count }}
          REVIEW_URL: ${{ steps.review.outputs.review-url }}
        run: |
          echo "Open findings: $FINDINGS_COUNT, critical: $CRITICAL_COUNT, review: ${REVIEW_URL:-none}"
