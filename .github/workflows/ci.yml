name: CI

on:
  pull_request:
  push:
    branches: [main]

# The CI only reads the code. It needs no secrets and no write access.
permissions:
  contents: read

# A newer push to a pull request replaces the older run. Runs on main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Runs against the bundle that is checked in, before it is rebuilt.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # GitHub runs dist/, not src/. A bundle that is out of date would ship old code.
      - name: Check that dist/ matches the sources
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ does not match the sources. Run 'npm run build' and commit the result."
            git status --porcelain dist/
            git diff --stat dist/
            exit 1
          fi
