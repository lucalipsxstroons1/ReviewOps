name: Eval

on:
  # Runs when the prompt, the answer format or the reference diffs change.
  pull_request:
    paths:
      - src/ai/**
      - eval/**
      - "!eval/compare/**"
      - .github/workflows/eval.yml
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model to evaluate. Empty means the default model of the action.
        required: false
        default: ""
      language:
        description: Language of the feedback, one of the codes of the input language of the action (en, de, fr, ...). Empty means English. The thresholds are the same in every language.
        required: false
        default: ""

# The evaluation only reads the code. It writes nothing back to GitHub.
permissions:
  contents: read

# A newer push replaces the older run, which would only cost money. Runs by
# hand on the same branch share this group as well: start them one after
# the other, or each new one cancels the one before.
concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Evaluate the prompt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The key reaches this step only. It is the repository secret
      # OPENAI_API_KEY, the same one that reviewops.yml uses. A pull request
      # from a fork gets no secrets, and the evaluation then ends with a
      # notice; a run by hand without the key fails. The model name and the
      # language go through the environment, never into the command.
      - name: Evaluate the prompt against the OpenAI API
        run: npm run eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_LANGUAGE: ${{ inputs.language }}
