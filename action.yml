name: ReviewOps
description: Reviews pull requests with an AI model and posts the findings as inline review comments.
author: lucalipsxstroons1

branding:
  icon: git-pull-request
  color: purple

inputs:
  github-token:
    description: Token used to read the pull request and post the review. It needs the permission pull-requests write. Defaults to the GITHUB_TOKEN of the workflow run.
    required: false
    default: ${{ github.token }}
  openai-api-key:
    description: OpenAI API key used to request the review. Pass it from a repository secret, never as plain text.
    required: true
  openai-model:
    description: OpenAI model that writes the review, for example gpt-6-luna or gpt-6.1-sol. It has to support Structured Outputs. A model with a low token limit per minute can fail on large pull requests. The default is gpt-6-luna.
    required: false
    default: gpt-6-luna
  language:
    description: Language of the feedback, as one of the codes en, de, fr, es, it, pt, nl, pl, tr, ja, zh and ko. Code, identifiers, file paths, severities and categories stay in English. The default is en.
    required: false
    default: en
  exclude:
    description: Additional glob patterns for files to leave out of the review, one per line. They extend the built-in list (lockfiles, build output, generated code, binary files). A pattern without a slash applies in every directory, a pattern with a slash from the root of the repository.
    required: false
    default: ""
  max-files:
    description: Maximum number of files that are reviewed, a whole number of at least 1. If a pull request has more files, the files after the limit (in the order GitHub lists them) are skipped and named in the log. The default is 50.
    required: false
    default: "50"
  max-diff-chars:
    description: Maximum size of the diffs that are reviewed, counted in characters of the annotated diff, a whole number of at least 1. A file that no longer fits is skipped and named in the log, later smaller files can still follow. The default is 200000, which is about 50000 to 65000 tokens.
    required: false
    default: "200000"
  max-comments:
    description: Maximum number of findings the review shows, a whole number of at least 1. The most serious findings come first; findings at a line of the diff become inline comments, the others are listed in the text of the review. Findings beyond the limit are left out and counted in the log. The default is 10.
    required: false
    default: "10"
  fail-on:
    description: "Lets the step fail when open findings reach this severity, as one of none, critical and major. major includes critical. The step fails only after the review is posted. Open findings are the findings of this run and earlier comments of ReviewOps whose line has not changed (also after a rename of the file or a change of the line above) and whose thread is not resolved. The default is none, so no finding fails the workflow. It is a reminder, not a protection against the author of a pull request: see SECURITY.md."
    required: false
    default: none
  review-drafts:
    description: Whether draft pull requests are reviewed, as true or false. By default a draft is left out, and the review starts when the pull request is marked ready for review (add the event type ready_for_review to the workflow). A run that leaves out the review asks no model and posts nothing, but it still counts the open findings of earlier reviews and applies fail-on. The default is false.
    required: false
    default: "false"
  skip-label:
    description: Name of a label that leaves out the review of a pull request that has it, without regard to case, at most 50 characters. An empty value switches the label off. Taking the label off starts the review when the workflow listens to the event type unlabeled. A run that leaves out the review asks no model and posts nothing, but it still counts the open findings of earlier reviews and applies fail-on. The default is no-ai-review.
    required: false
    default: no-ai-review
  review-bots:
    description: Whether pull requests that a bot opened, such as Dependabot, are reviewed, as true or false. By default they are left out. A run that leaves out the review asks no model and posts nothing, but it still counts the open findings of earlier reviews and applies fail-on. The default is false.
    required: false
    default: "false"
  insights-url:
    description: Address that receives a report with the key figures of every review, for ReviewOps Insights. The report holds the repository, the pull request number, the model, the token usage, the duration and the severity, category and file path of each finding, never code and never a text of the model. Only https is accepted (http only for localhost and 127.0.0.1), at most 2048 characters, without credentials, query or fragment. Pass it from a repository variable. Empty switches the report off, and the action then makes no request except to GitHub and OpenAI. The default is empty.
    required: false
    default: ""
  insights-secret:
    description: Secret that signs the report with HMAC-SHA256, the same value as INGEST_SECRET at ReviewOps Insights. At least 32 visible ASCII characters. Required when insights-url is set. Pass it from a repository secret, never as plain text. Without insights-url it is ignored.
    required: false

outputs:
  findings-count:
    description: Number of open findings, the findings of this run and the earlier comments of ReviewOps whose line has not changed (also after a rename of the file or a change of the line above) and whose thread is not resolved. Set on every run that does not fail with an error, also when fail-on lets the step fail.
  critical-count:
    description: Number of open findings with the severity critical, counted like findings-count.
  review-url:
    description: Address of the review that this run posted. Empty when the run posted no review.

runs:
  using: node24
  main: dist/index.js
